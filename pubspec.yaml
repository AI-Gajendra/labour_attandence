name: labour_attendance
description: "Labour Manager — attendance, advances (kharchi) and payroll for a small contractor."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  provider: ^6.1.5+1
  firebase_auth: ^6.5.7
  crypto: ^3.0.7
  # Pinned to 10.x: 11.0.0 requires compileSdk 37, which Flutter 3.38.7 does
  # not yet target. 10.x has the same API and the same modern ciphers.
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "ui_screens/logo (2).png"

flutter:
  uses-material-design: true

  assets:
    - assets/

  # Variable fonts — a single file per family carries every weight the design
  # system uses (w300…w800). See DS.fontHeadline / DS.fontBody.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
